[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  # ≥0.146 required: `type:` front-matter resolution needs 0.146+, and the modern
  # `build:` section key (content/pages|landing/_index.md) needs 0.145+ (Hugo removed
  # the old `_build:` at 0.145). Kept <0.156 to avoid languageCode/.Site.Data
  # deprecation warnings. (Bumped from 0.140.0 — rovaniemidaytours 2026-07-30.)
  HUGO_VERSION = "0.146.0"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://widget.getyourguide.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://widget.getyourguide.com https://*.tile.openstreetmap.org; frame-src https://widget.getyourguide.com;"
