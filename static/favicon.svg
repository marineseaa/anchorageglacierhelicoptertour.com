<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- PER-SITE MARK for anchorageglacierhelicoptertour.com: a helicopter in profile
       over a glacier ridge. Square corners (no rx) to match the FLAT design system.
       This is a STANDALONE file, so it cannot read :root - the hexes below are this
       site's palette written out literally: bg --deep-canal #2A3740, ice ridge
       --gold #2F7290 with an --accent-on-dark #A1C0CD facet, aircraft
       --canal-light #EAF1F4. If the palette changes, change them here too, then
       re-run _gen_favicons.py so the PNGs come from the new art.
       See HUGO-SITE-DEPLOYMENT-CHECKLIST.md "Silent-failure checks" G. -->
  <rect width="32" height="32" fill="#2A3740"/>
  <!-- glacier ridge -->
  <path d="M0 32 L0 26 L7 21 L12.5 25.5 L19 20 L25 25 L32 21.5 L32 32 Z" fill="#2F7290"/>
  <path d="M19 20 L25 25 L21.3 25.6 Z" fill="#A1C0CD"/>
  <!-- helicopter -->
  <rect x="4" y="7.4" width="24" height="1.7" fill="#EAF1F4"/>
  <rect x="15.1" y="9.1" width="1.8" height="2.1" fill="#EAF1F4"/>
  <ellipse cx="13" cy="13.6" rx="6" ry="3.2" fill="#EAF1F4"/>
  <rect x="17.5" y="12.7" width="9.5" height="1.7" fill="#EAF1F4"/>
  <path d="M25.4 9.6 L28 9.6 L26.9 13.2 L25.4 13.2 Z" fill="#EAF1F4"/>
  <rect x="7.2" y="17.5" width="11.6" height="1.3" fill="#EAF1F4"/>
  <rect x="10" y="16.7" width="1.3" height="1.1" fill="#EAF1F4"/>
  <rect x="14.8" y="16.7" width="1.3" height="1.1" fill="#EAF1F4"/>
</svg>
