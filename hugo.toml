[[params.steps]]
  number = "1"
  title  = "Pick Your Direction"
  body   = "Nothing lifts off from Anchorage itself. Knik Glacier flights leave from the Knik River valley, about an hour north; Punchbowl and the Chugach icefields leave from Girdwood, 40 miles south. Choose before you book — the drive is yours to make."

[[params.steps]]
  number = "2"
  title  = "Book a Morning Slot"
  body   = "Alaskan cloud builds through the day. Early departures fly more reliably than afternoon ones, and if weather does close in, an early booking leaves room to be rebooked later the same day."

[[params.steps]]
  number = "3"
  title  = "Weigh In and Brief"
  body   = "Every passenger is weighed — seat limits are real and enforced, and weights decide who sits where. You'll get a safety briefing, and on glacier landings, overboots for the snow."

[[params.steps]]
  number = "4"
  title  = "Fly, Land, Walk on the Ice"
  body   = "Thirty minutes over crevasse fields and meltwater pools, then the skids touch down and the rotor winds off. What happens next — a walk, a dog team, a paddleboard, an ice axe — is what you chose at step one."
